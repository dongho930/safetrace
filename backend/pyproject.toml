[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "safetrace"
version = "0.1.0"
description = "SafeTrace - 위협 의심 사이트 자율 후보 발굴·증거화·공공 심의 지원 시스템"
requires-python = ">=3.13"
# 버전 고정: 공급망 위험 통제(기획서 2.7). 정확한 전이 의존성은 requirements.lock 참조.
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "httpx==0.28.1",
    "idna>=3.10",
]

[project.optional-dependencies]
browser = ["playwright>=1.55"]
# 제로샷 분류는 선택 설치. 미설치 시 규칙 기반 특징만으로 동작하며 model_meta 에 기록된다.
ai = ["torch>=2.8", "transformers>=4.56", "sentencepiece>=0.2"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8", "bandit>=1.8", "pip-audit>=2.7"]

[project.scripts]
safetrace-api = "safetrace.api.app:main"
safetrace-worker = "safetrace.worker.main:main"
safetrace-signer = "safetrace.signer.app:main"
safetrace-proxy = "safetrace.proxy.egress:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
safetrace = ["py.typed", "data/*.txt", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["browser: Playwright/Chromium 이 필요한 통합 시험"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]

[tool.bandit]
exclude_dirs = ["tests"]
