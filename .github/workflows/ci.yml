name: ci

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Install (lockfile 강제)
        run: |
          python -m pip install --upgrade pip
          grep -viE '^(colorama|pywin32|pywin32-ctypes)==' requirements.lock > /tmp/constraints.txt
          pip install -c /tmp/constraints.txt -e ".[browser,dev]"
          python -m playwright install --with-deps chromium
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Unit & security tests
        run: pytest -q -m "not browser"
      - name: Browser integration tests
        run: pytest -q -m browser
      - name: SAST (bandit)
        run: bandit -q -r src -lll
      - name: SCA (pip-audit)
        run: pip-audit -r /tmp/constraints.txt --strict --desc

  frontend:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: SCA (npm audit)
        run: npm audit --audit-level=high

  semgrep:
    runs-on: ubuntu-24.04
    container: { image: semgrep/semgrep }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - run: semgrep scan --error --config p/python --config p/owasp-top-ten --config p/react --config .semgrep/safetrace.yml

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
