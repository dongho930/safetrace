# Worker 망(inv)에 노출되는 유일한 내부 진입점. /ingest/v1/* 만 api 로 전달하고 나머지는 모두 거부한다.
worker_processes 1;
pid /var/run/nginx.pid;
events { worker_connections 256; }

http {
    server_tokens off;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    client_body_temp_path /tmp/body;
    proxy_temp_path /tmp/proxy;
    client_max_body_size 64m;
    limit_req_zone $binary_remote_addr zone=ingest:1m rate=30r/s;

    server {
        listen 8080;

        location ~ ^/ingest/v1/(lease|jobs/[A-Za-z0-9_]+/(frame|step|result|fail|artifact/(SCREENSHOT|HTML|OBSERVATION|VIDEO|HAR)))$ {
            limit_except POST { deny all; }
            limit_req zone=ingest burst=60 nodelay;
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host api;
            proxy_read_timeout 60s;
        }

        location / { return 403; }
    }
}
