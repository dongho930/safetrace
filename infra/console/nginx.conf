worker_processes 1;
pid /var/run/nginx.pid;
events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    server_tokens off;
    client_body_temp_path /tmp/body;
    proxy_temp_path /tmp/proxy;

    server {
        listen 8080;
        root /usr/share/nginx/html;

        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;

        location /api/ {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_buffering off;          # SSE
            proxy_read_timeout 1h;
            proxy_set_header Connection "";
        }
        location /ingest/ { return 403; }
        location / { try_files $uri /index.html; }
    }
}
