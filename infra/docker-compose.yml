# SafeTrace 개발·시연 환경(사전준비 확정본). docs/02_architecture.md §3 네트워크 격리와 1:1 대응.
#
#   [inv]  internal: 조사 Worker · egress-proxy · ingest-gw        ← Worker 는 이 망에만 연결(인터넷 출구 없음)
#   [svc]  internal: api · signer · postgres · redis · ingest-gw   ← 내부 서비스(Worker 접근 불가)
#   [out]  bridge  : egress-proxy · api(Safe Browsing·DNS 사전검사)  ← 외부 출구
#   [front] bridge : console(nginx) · api                           ← 사용자 영역(127.0.0.1 에만 게시)
#
# 비밀값은 ../secrets/ (gitignore) 에서 읽는다. 생성: python scripts/gen_secrets.py

name: safetrace

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

networks:
  inv:
    internal: true
  svc:
    internal: true
  out: {}
  front: {}

volumes:
  evidence: {}
  signer-state: {}
  pgdata: {}

secrets:
  signer_key:
    file: ../secrets/signer_key.hex

services:
  api:
    <<: *hardening
    build: { context: .., dockerfile: infra/docker/app.Dockerfile }
    image: safetrace/app:0.1.0
    command: ["safetrace-api"]
    env_file: ../.env
    environment:
      SAFETRACE_API_HOST: 0.0.0.0
      SAFETRACE_SIGNER_URL: http://signer:8081
      SAFETRACE_DATA_DIR: /data
    volumes: ["evidence:/data"]
    tmpfs: ["/tmp:size=64m"]
    networks: [svc, out, front]
    depends_on: [signer]
    mem_limit: 1g
    pids_limit: 256

  signer:
    <<: *hardening
    image: safetrace/app:0.1.0
    command: ["safetrace-signer"]
    environment:
      SAFETRACE_SIGNER_HOST: 0.0.0.0
      SAFETRACE_SIGNER_KEY_FILE: /run/secrets/signer_key
      SAFETRACE_SIGNER_STATE: /state/state.json
      SAFETRACE_SIGNER_TOKEN: ${SAFETRACE_SIGNER_TOKEN:?run scripts/gen_secrets.py}
    secrets: [signer_key]
    volumes: ["signer-state:/state"]
    networks: [svc]  # 키는 이 컨테이너에만 존재. 증거 볼륨을 마운트하지 않는다.
    mem_limit: 256m
    pids_limit: 64

  ingest-gw:
    <<: *hardening
    image: nginx:1.29-alpine
    volumes: ["./ingest-gw/nginx.conf:/etc/nginx/nginx.conf:ro"]
    tmpfs: ["/var/cache/nginx:size=16m", "/var/run:size=1m", "/tmp:size=16m"]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    networks: [inv, svc]
    depends_on: [api]

  egress-proxy:
    <<: *hardening
    image: safetrace/app:0.1.0
    command: ["safetrace-proxy"]
    environment:
      SAFETRACE_PROXY_HOST: 0.0.0.0
      SAFETRACE_PROXY_PORT: "3128"
    networks: [inv, out]
    mem_limit: 256m
    pids_limit: 128

  worker:
    <<: *hardening
    build: { context: .., dockerfile: infra/docker/worker.Dockerfile }
    image: safetrace/worker:0.1.0
    command: ["safetrace-worker"]
    environment:
      SAFETRACE_WORKER_TOKEN: ${SAFETRACE_WORKER_TOKEN:?run scripts/gen_secrets.py}
      SAFETRACE_WORKER_ID: worker-1
      SAFETRACE_INGEST_URL: http://ingest-gw:8080
      SAFETRACE_EGRESS_PROXY: http://egress-proxy:3128
    tmpfs: ["/tmp:size=512m", "/home/pwuser:size=64m"]
    shm_size: 512m
    networks: [inv]  # 내부 서비스 망(svc)·외부 망(out)에 연결하지 않는다
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    depends_on: [ingest-gw, egress-proxy]

  # D1-R 실데이터 수집(2주차 말까지 매일). 조사 Worker 와 같은 격리 조건, 프록시 경유만 허용.
  collector:
    <<: *hardening
    image: safetrace/worker:0.1.0
    profiles: [collector]
    command: ["python", "/tools/collect/d1r_collect.py", "--daily", "--out", "/data/d1r"]
    environment:
      SAFETRACE_EGRESS_PROXY: http://egress-proxy:3128
      SAFETRACE_D1R_ISOLATED: "1"
    volumes: ["../tools:/tools:ro", "../data/d1r:/data/d1r"]
    tmpfs: ["/tmp:size=512m", "/home/pwuser:size=64m"]
    shm_size: 512m
    networks: [inv]
    mem_limit: 2g
    pids_limit: 512
    depends_on: [egress-proxy]

  console:
    <<: *hardening
    build: { context: .., dockerfile: infra/docker/console.Dockerfile }
    image: safetrace/console:0.1.0
    tmpfs: ["/var/cache/nginx:size=16m", "/var/run:size=1m", "/tmp:size=16m"]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    ports: ["127.0.0.1:${SAFETRACE_CONSOLE_PORT:-8088}:8080"]
    networks: [front]
    depends_on: [api]

  # 1주차(API/DB/Queue)에서 오케스트레이터 상태 원본·작업 큐로 연결한다. 스키마는 사전 적재.
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: safetrace
      POSTGRES_USER: safetrace
      POSTGRES_PASSWORD: ${SAFETRACE_DB_PASSWORD:?run scripts/gen_secrets.py}
    volumes: ["pgdata:/var/lib/postgresql", "./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro"]
    networks: [svc]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${SAFETRACE_REDIS_PASSWORD:?run scripts/gen_secrets.py}",
              "--appendonly", "yes", "--rename-command", "FLUSHALL", "", "--rename-command", "CONFIG", ""]
    networks: [svc]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
